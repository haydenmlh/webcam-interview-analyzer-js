name: Deploy GitHub Pages (Dev)

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_NIM_BASE_URL: ${{ secrets.VITE_NIM_BASE_URL }}

      - name: Include GPL-3.0 license in published site
        run: cp LICENSE dist/LICENSE

      - name: Set dev CNAME
        run: echo "dev.interview.haydenmlh.com" > dist/CNAME

      - name: Publish Dev to GitHub Pages branch in this repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages-dev
          publish_dir: ./dist
          cname: dev.interview.haydenmlh.com
          force_orphan: true
          commit_message: "Deploy dev from source: ${{ github.sha }}"