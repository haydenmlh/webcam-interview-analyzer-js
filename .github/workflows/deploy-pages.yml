name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_NIM_BASE_URL: ${{ secrets.VITE_NIM_BASE_URL }}

      - name: Include GPL-3.0 license in published site
        run: cp LICENSE dist/LICENSE

      - name: Publish to external pages repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: haydenmlh/webcam-interview-analyzer-page
          publish_branch: gh-pages
          publish_dir: ./dist
          cname: interview.haydenmlh.com
          force_orphan: true
          commit_message: "Deploy from source: ${{ github.sha }}"
